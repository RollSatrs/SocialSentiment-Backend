services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: socialsentiment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - socialsentiment_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d socialsentiment"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/socialsentiment
      APP_SENTIMENT_MODE: ${APP_SENTIMENT_MODE:-ai}
      APP_PARSER_BASE_URL: http://host.docker.internal:4002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4001:4001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  socialsentiment_db:
