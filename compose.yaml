services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: socialsentiment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in environment}
    ports:
      - "5433:5432"
    volumes:
      - socialsentiment_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d socialsentiment"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  socialsentiment_db:
